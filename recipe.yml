name: D8+ Recipe
type: Site
description: Applies the foundational Drupal core recipes.
recipes:
  - core/recipes/administrator_role
  - core/recipes/core_recommended_admin_theme
install:
  - autoban_ban
  - autoban_dblog
  - block
  - d8_theme
  - dblog
  - exception_mailer
  - extlink
  - fontawesome
  - standwithukraine
  - symfony_mailer
config:
  strict: true
  actions:
    dblog.settings:
      simpleConfigUpdate:
        row_limit: 0
    exception_mailer.settings:
      simpleConfigUpdate:
        level_type.4: '4'
        level_type.7: '7'
    extlink.settings:
      simpleConfigUpdate:
        extlink_target: true
        extlink_noreferrer: false
        extlink_css_exclude: .standwithukraine
        extlink_mailto_class: '0'
        extlink_tel_class: ''
        extlink_use_font_awesome: true
        extlink_font_awesome_classes:
          links: 'fa fa-clone'
          mailto: 'fa fa-envelope-o'
        extlink_icon_placement: append
        whitelisted_domains: {  }
    fontawesome.settings:
      simpleConfigUpdate:
        method: webfonts
        external_svg_location: 'https://use.fontawesome.com/releases/v6.5.0/css/all.css'
        external_shim_location: 'https://use.fontawesome.com/releases/v6.4.0/css/v4-shims.css'
        allow_pseudo_elements: false
        use_regular_file: false
        use_light_file: false
        use_brands_file: false
        use_duotone_file: false
        use_thin_file: false
        external_svg_integrity: ''
        use_sharpregular_file: false
        use_sharplight_file: false
        use_sharpsolid_file: false
        use_custom_file: false
    standwithukraine.settings:
      simpleConfigUpdate:
        message.text: |-
          Glory to
          Ukraine
        message.url: 'https://supportukrainenow.org'
    symfony_mailer.settings:
      simpleConfigUpdate:
        default_transport: docker4drupal
    system.cron:
      simpleConfigUpdate:
        logging: false
    system.image.gd:
      simpleConfigUpdate:
        jpeg_quality: 100
    system.theme:
      simpleConfigUpdate:
        default: d8_theme
        favicon: true
    user.mail:
      simpleConfigUpdate:
        cancel_confirm.body: |-
          A request to cancel your account has been made at [site:name].

          You may now cancel your account on [site:url-brief] by clicking this link or copying and pasting it into your browser:

          [user:cancel-url]

          NOTE: The cancellation of your account is not reversible.

          This link expires in one day and nothing will happen if it is not used.
        password_reset.body: |-
          A request to reset the password for your account has been made at [site:name].

          You may now log in by clicking this link or copying and pasting it into your browser:

          [user:one-time-login-url]

          This link can only be used once to log in and will lead you to a page where you can set your password. It expires after one day and nothing will happen if it's not used.
        register_admin_created.body: |-
          A site administrator at [site:name] has created an account for you. You may now log in by clicking this link or copying and pasting it into your browser:

          [user:one-time-login-url]

          This link can only be used once to log in and will lead you to a page where you can set your password.

          After setting your password, you will be able to log in at [site:login-url] in the future using:

          username: [user:name]
          password: Your password
        register_no_approval_required.body: |-
          Thank you for registering at [site:name]. You may now log in by clicking this link or copying and pasting it into your browser:

          [user:one-time-login-url]

          This link can only be used once to log in and will lead you to a page where you can set your password.

          After setting your password, you will be able to log in at [site:login-url] in the future using:

          username: [user:name]
          password: Your password
        register_pending_approval.body: 'Thank you for registering at [site:name]. Your application for an account is currently pending approval. Once it has been approved, you will receive another email containing information about how to log in, set your password, and other details.'
        status_activated.body: |-
          Your account at [site:name] has been activated.

          You may now log in by clicking this link or copying and pasting it into your browser:

          [user:one-time-login-url]

          This link can only be used once to log in and will lead you to a page where you can set your password.

          After setting your password, you will be able to log in at [site:login-url] in the future using:

          username: [user:account-name]
          password: Your password
        status_blocked.body: 'Your account on [site:name] has been blocked.'
        status_canceled.body: 'Your account on [site:name] has been canceled.'
    user.settings:
      simpleConfigUpdate:
        notify.status_blocked: true
        notify.status_canceled: true
        register: admin_only
    views.settings:
      simpleConfigUpdate:
        ui.show.advanced_column: true
        ui.show.sql_query.enabled: true

